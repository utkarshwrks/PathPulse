packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 reads this here, not from package.json's "pnpm" field — which it
# ignores with a warning on every single command. esbuild needs its postinstall
# to fetch the platform binary; without it vitest and tsx cannot run at all.
onlyBuiltDependencies:
  - esbuild
