# Keeps a free-tier deployment awake without anyone having the site open.
#
# ★ WHY THIS EXISTS AND THE IN-APP PING DOES NOT REPLACE IT ★
# apps/web/lib/keepAlive.ts pings /health.json every five minutes from the
# browser, which keeps the service warm during a session — a judge reading the
# landing page keeps it warm for the moment they press Download. It does
# nothing once the last tab closes. Come back a month later and the service has
# been asleep for a month.
#
# This runs on GitHub's schedule instead, so it does not care whether anyone is
# looking. That is the difference between "warm while in use" and "never cold".
#
# ★ IF THE SITE IS A RENDER STATIC SITE, DELETE THIS FILE ★
# Static sites do not sleep. This is only needed for a free *Web Service*.
name: keepalive

on:
  schedule:
    # Every 5 minutes. GitHub queues cron on shared runners and can be several
    # minutes late under load, which is exactly why the interval is a third of
    # the 15-minute idle window rather than a half: two consecutive late runs
    # still land inside it.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let a backlog of delayed runs pile up into a stampede.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables.
          # e.g. https://pathpulse.onrender.com
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL variable is not set — nothing to ping."
            echo "Add it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi
          # A cold service takes ~50 s to boot, so the timeout must exceed that
          # or the ping that was supposed to wake it reports failure instead.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 10 \
                   -H 'Cache-Control: no-cache' \
                   "$SITE_URL/health.json?t=$(date +%s)") || code=000
          echo "health.json -> $code"
          # 2xx and 3xx both mean the origin answered, which is all this needs.
          case "$code" in
            2*|3*) exit 0 ;;
            *) echo "::warning::health check returned $code"; exit 0 ;;
          esac
